```yaml
name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ti99_libretro.so
            artifact: ti99_libretro-linux.so
          - os: windows-latest
            target: ti99_libretro.dll
            artifact: ti99_libretro-windows.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-toolchain

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          make

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: make

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.target }}" "dist/${{ matrix.artifact }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          echo "NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Build Android
        run: |
          cd jni
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=${{ matrix.abi }}

      - name: Locate Android Library
        shell: bash
        run: |
          mkdir -p dist

          SO_FILE=$(find jni -type f \
            -path "*/${{ matrix.abi }}/ti99_libretro.so" \
            -print -quit)

          if [ -z "$SO_FILE" ]; then
            echo "ERROR: Library not found for ${{ matrix.abi }}"
            find jni -type f -name "*.so"
            exit 1
          fi

          echo "Found: $SO_FILE"

          cp "$SO_FILE" "dist/ti99_libretro-android-${{ matrix.abi }}.so"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti99_libretro-android-${{ matrix.abi }}
          path
