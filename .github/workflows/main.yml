name: Build Release

# Every push / pull request builds and tests everything (artifacts can be downloaded from the run page).
# A tag "v*" (or "Run workflow" with a release tag) also publishes the zips on a GitHub release.
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (leave blank to only build)'
        required: false
        type: string

permissions:
  contents: write

jobs:

  # ==========================================
  # UNIT TESTS
  # ==========================================

  test:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            cc: gcc
          - name: x86 32-bit
            cc: gcc -m32
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3

      - name: make test
        run: make test CC="${{ matrix.cc }}"

      - name: Frontend harness (loads the built core like RetroArch does)
        if: matrix.name == 'x86-64'
        run: make hosttest

  # ==========================================
  # WINDOWS (amd64)
  # ==========================================

  build-windows:
    name: Build (Windows amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-toolchain

      - name: Build
        shell: msys2 {0}
        run: make

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg, dist | Out-Null
          Copy-Item ti99_libretro.dll, ti99_libretro.info pkg/
          Compress-Archive -Path pkg/ti99_libretro.dll, pkg/ti99_libretro.info -DestinationPath dist/ti99_libretro-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ti99_libretro-windows-amd64
          path: dist/*.zip

  # ==========================================
  # LINUX amd64 (desktop)
  # ==========================================

  build-linux:
    name: Build (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip
          make
      - name: Package
        run: |
          mkdir -p pkg dist
          cp ti99_libretro.so ti99_libretro.info pkg/
          (cd pkg && zip -9 ../dist/ti99_libretro-linux-amd64.zip ti99_libretro.so ti99_libretro.info)
      - uses: actions/upload-artifact@v4
        with:
          name: ti99_libretro-linux-amd64
          path: dist/*.zip

  # ==========================================
  # ANDROID (32-bit ARM and 64-bit ARM)
  # ==========================================

  build-android:
    name: Build (Android ${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ armeabi-v7a, arm64-v8a ]
    steps:
      - uses: actions/checkout@v4

      - name: Build with the NDK
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "Using NDK: $NDK"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk APP_ABI=${{ matrix.abi }} -j"$(nproc)"
          ls -l libs/${{ matrix.abi }}/

      - name: "Package (RetroArch's Android core file is <name>_libretro_android.so)"
        run: |
          mkdir -p pkg dist
          cp libs/${{ matrix.abi }}/libti99_libretro.so pkg/ti99_libretro_android.so
          cp ti99_libretro.info pkg/
          file pkg/ti99_libretro_android.so
          (cd pkg && zip -9 ../dist/ti99_libretro-android-${{ matrix.abi }}.zip ti99_libretro_android.so ti99_libretro.info)

      - uses: actions/upload-artifact@v4
        with:
          name: ti99_libretro-android-${{ matrix.abi }}
          path: dist/*.zip

  # ==========================================
  # ARM LINUX (best guess for the modded Atari Gamestation Pro / Intellivision Sprint)
  # ==========================================
  # None of these has been run on the handhelds. Three flavours are built because the exact userland of the
  # modded firmware is not known: 32-bit ARM hard-float (most likely), 32-bit soft-float, and 64-bit.
  # Compiler flags avoid anything the minimal libc of an embedded firmware may lack (no stack protector, no
  # _FORTIFY_SOURCE helpers) and the glibc symbol versions are checked to be old.

  build-linux-arm:
    name: Build (Linux ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7hf
            packages: gcc-arm-linux-gnueabihf qemu-user
            cc: arm-linux-gnueabihf-gcc
            arch_flags: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
            qemu: qemu-arm
            sysroot: /usr/arm-linux-gnueabihf
          - name: armv7sf
            packages: gcc-arm-linux-gnueabi qemu-user
            cc: arm-linux-gnueabi-gcc
            arch_flags: -march=armv7-a -mfloat-abi=soft
            qemu: qemu-arm
            sysroot: /usr/arm-linux-gnueabi
          - name: aarch64
            packages: gcc-aarch64-linux-gnu qemu-user
            cc: aarch64-linux-gnu-gcc
            arch_flags: ''
            qemu: qemu-aarch64
            sysroot: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} binutils python3 zip

      - name: Build the core
        env:
          CFLAGS: -O2 ${{ matrix.arch_flags }} -fno-stack-protector -U_FORTIFY_SOURCE
          LDFLAGS: -static-libgcc
        run: |
          make CC=${{ matrix.cc }}
          file ti99_libretro.so
          readelf -A ti99_libretro.so | head -20 || true

      - name: Check which libc symbols the core needs (must stay basic)
        run: |
          echo "--- undefined symbols:"; nm -D --undefined-only ti99_libretro.so | awk '{print $NF}' | sort -u | tr '\n' ' '; echo
          if nm -D --undefined-only ti99_libretro.so | grep -E '_chk|__stack_chk'; then
            echo "::error::core needs fortify/stack-protector helpers that small libcs lack"; exit 1
          fi
          readelf -V ti99_libretro.so | grep -o 'GLIBC_[0-9.]*' | sort -uV || true
          if readelf -V ti99_libretro.so | grep -qE 'GLIBC_2\.(1[8-9]|[2-9][0-9])'; then
            echo "::error::core needs a glibc newer than 2.17"; exit 1
          fi

      - name: "Run the unit tests under QEMU (informational, needs qemu-user)"
        continue-on-error: true
        env:
          CFLAGS: -O2 ${{ matrix.arch_flags }} -fno-stack-protector
        run: |
          make test_ti99 CC=${{ matrix.cc }}
          python3 tests/make_testzip.py tests/deflate_test.zip
          ${{ matrix.qemu }} -L ${{ matrix.sysroot }} ./test_ti99 tests/deflate_test.zip

      - name: Package
        run: |
          mkdir -p pkg dist
          cp ti99_libretro.so ti99_libretro.info packaging/ARM-LINUX.md pkg/
          (cd pkg && zip -9 ../dist/ti99_libretro-linux-${{ matrix.name }}.zip ti99_libretro.so ti99_libretro.info ARM-LINUX.md)

      - uses: actions/upload-artifact@v4
        with:
          name: ti99_libretro-linux-${{ matrix.name }}
          path: dist/*.zip

  # ==========================================
  # GITHUB RELEASE
  # ==========================================

  create-release:
    name: Create GitHub Release
    needs: [ test, build-windows, build-linux, build-android, build-linux-arm ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List
        run: ls -lR release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release-artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
