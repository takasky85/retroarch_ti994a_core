name: Build Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (leave blank if running directly from a tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:

  # ==========================================
  # DESKTOP BUILDS
  # ==========================================

  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: ti99_libretro.so
            artifact_name: ti99_libretro-linux.so

          - os: windows-latest
            target_name: ti99_libretro.dll
            artifact_name: ti99_libretro-windows.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-toolchain

      - name: Build with Make (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          make

      - name: Build with Make (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          make

      - name: Prepare Desktop Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.target_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*


  # ==========================================
  # CREATE GITHUB RELEASE
  # ==========================================

  create-release:
    name: Create GitHub Release
    needs:
      - build-desktop

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Downloaded Files
        run: |
          ls -R release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-artifacts/**/*.dll
            release-artifacts/**/*.so
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
