```yaml
name: Build Release New

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (leave blank if running directly from a tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:

  # ==========================================
  # DESKTOP BUILDS
  # ==========================================

  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: ti99_libretro.so
            artifact_name: ti99_libretro-linux.so

          - os: windows-latest
            target_name: ti99_libretro.dll
            artifact_name: ti99_libretro-windows.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-toolchain

      - name: Build with Make (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          make

      - name: Build with Make (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          make

      - name: Prepare Desktop Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.target_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  # ==========================================
  # ANDROID BUILDS
  # ==========================================

  build-android:
    name: Build (Android - ${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          echo "Android NDK: $ANDROID_NDK_HOME"
          echo "NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Build Android Core
        run: |
          cd jni
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=${{ matrix.abi }}

      - name: Diagnose Android Output
        run: |
          echo "Searching for Android shared libraries..."
          find jni -type f -name "*.so" -print

      - name: Prepare Android Artifact
        shell: bash
        run: |
          mkdir -p dist

          SO_FILE=$(find jni -type f \
            -name "ti99_libretro.so" \
            -print -quit)

          if [ -z "$SO_FILE" ]; then
            echo "ERROR: Android library not found!"
            echo "Files found under jni:"
            find jni -type f
            exit 1
          fi

          echo "Found: $SO_FILE"

          cp "$SO_FILE" \
            "dist/ti99_libretro-android-${{ matrix.abi }}.so"

          echo "Android artifact created successfully."

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti99_libretro-android-${{ matrix.abi }}
          path: dist/*

  # ==========================================
  # GITHUB RELEASE
  # ==========================================

  create-release:
    name: Create GitHub Release

    needs:
      - build-desktop
      - build-android

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Downloaded Files
        run: |
          ls -R release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-artifacts/**/*.dll
            release-artifacts/**/*.so
          draft: false
          prerelease: false
        env:
          G
